name: Build Signed Release APK (رحلة النور)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          SDKMGR=$(command -v sdkmanager || ls -d "${ANDROID_HOME}/cmdline-tools"/*/bin/sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies & prepare Android project
        env:
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
          VITE_APP_BUILD: ${{ github.run_number }}
        run: |
          npm install --legacy-peer-deps
          npm run build
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          for d in android/app/src/main/res/mipmap-*; do
            [ -f "$d/ic_launcher.png" ] && cp public/pwa-192x192.png "$d/ic_launcher.png" || true
            [ -f "$d/ic_launcher_round.png" ] && cp public/pwa-192x192.png "$d/ic_launcher_round.png" || true
            [ -f "$d/ic_launcher_foreground.png" ] && cp public/pwa-maskable-512x512.png "$d/ic_launcher_foreground.png" || true
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#064E3B</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.WAKE_LOCK"
            ];
            for (const perm of perms) {
              if (!xml.includes(perm)) {
                xml = xml.replace("</manifest>", `    <uses-permission android:name="${perm}" />\n</manifest>`);
              }
            }
            fs.writeFileSync(p, xml);
          '
          npx cap sync android

      - name: Configure Release Signing & Version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret!"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/rihlat-release.keystore
          chmod 600 android/app/rihlat-release.keystore
          keytool -list -keystore android/app/rihlat-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"
          node -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let g = fs.readFileSync(p, "utf8");
            const verCode = Number(process.env.RUN_NUM || "1");
            const verName = `1.0.${verCode}`;
            g = g.replace(/versionCode\s+\d+/, `versionCode ${verCode}`);
            g = g.replace(/versionName\s+"[^"]+"/, `versionName "${verName}"`);
            const signingBlock = `    signingConfigs {\n        release {\n            storeFile file("rihlat-release.keystore")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release`;
            if (!/buildTypes\s*\{\s*\n\s*release\s*\{/.test(g)) {
              throw new Error("Unexpected build.gradle structure");
            }
            g = g.replace(/[ \t]*buildTypes\s*\{\s*\n[ \t]*release\s*\{/, signingBlock);
            fs.writeFileSync(p, g);
          '

      - name: Build & Verify Signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          APK_IN="android/app/build/outputs/apk/release/app-release.apk"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK_IN"
          mkdir -p dist-apk
          cp "$APK_IN" "dist-apk/build-signed-release.apk"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-signed-release-apk
          path: dist-apk/build-signed-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          TAG="v1.0.${RUN_NUM}"
          APK_FILE="dist-apk/build-signed-release.apk"
          gh release create "$TAG" "$APK_FILE" \
            --title "رحلة النور ${TAG}" \
            --notes "تحديث جديد موقّع وجاهز للتثبيت المباشر على الأندرويد وللنشر على APKPure (الإصدار v1.0.${RUN_NUM})."
